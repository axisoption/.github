<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0A1426"/>
      <stop offset="1" stop-color="#09101B"/>
    </linearGradient>
    <linearGradient id="brand" x1="130" y1="80" x2="610" y2="310" gradientUnits="userSpaceOnUse">
